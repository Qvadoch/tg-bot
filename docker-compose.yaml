services:
  bot_db:
    image: postgres:18.7
    environment:
      POSTGRES_DB: tg_bot
      POSTGRES_USER: tg_bot_admin
      POSTGRES_PASSWORD: ${BOT_DB_PASSWORD}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - bot_db_data:/var/lib/postgresql
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "pg_isready", "-h", "127.0.0.1", "-p", "5432", "-U", "tg_bot_admin", "-d", "tg_bot" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    stop_grace_period: 1m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  bot_db_data:
