spring:
  application:
    name: tg_bot
  jpa:
    hibernate:
      ddl-auto: validate
  datasource:
    url: jdbc:postgresql://127.0.0.1:5434/tg_bot
    username: tg_bot_app
    password: ${BOT_DB_APP_PASSWORD}
  flyway:
    user: tg_bot_admin
    password: ${BOT_DB_PASSWORD}

bot:
  token: ${BOT_TOKEN}
  list:
    permitted:
      users-id: ${USERS_ID}
  timezone: Europe/Moscow
  homework:
    sessions:
      max-size: 1000
      idle-timeout: PT30M

google:
  client-file: ${GOOGLE_CLIENT_FILE}
  tokens:
    encryption-key: ${GOOGLE_TOKEN_ENCRYPTION_KEY}
    dir: ${GOOGLE_TOKENS_DIR}
