spring:
  application:
    name: tg_bot

bot:
  token: ${BOT_TOKEN}
  list:
    permitted:
      users-id: ${USERS_ID}
  timezone: Europe/Moscow
  homework:
    sessions:
      max-size: 1000
      idle-timeout: PT30M

google:
  client-file: ${GOOGLE_CLIENT_FILE}
  tokens:
    dir: ${GOOGLE_TOKENS_DIR}
